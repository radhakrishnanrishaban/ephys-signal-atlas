[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosignal"
version = "0.2.0"
description = "Electrophysiology toolkit: LINK NWB loaders, SBP normalization, drift metrics, and decoders"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rishaban Radhakrishnan" }]

# Only what src/neurosignal imports. hdmf is pynwb's NWB backend, pinned so files stay readable.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "pynwb>=2.5",
  "hdmf>=3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3", "mypy>=1.9"]
notebook = ["jupyterlab>=4.1", "ipywidgets>=8.1", "nbconvert>=7.0"]
data = ["dandi>=0.62"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]  # repo root, so tests can import bench/
