[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosignal"
version = "0.2.0"
description = "Electrophysiology toolkit: LINK NWB loaders, SBP normalization, drift metrics, and decoders"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rishaban Radhakrishnan" }]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "polars>=0.20",
  "pyarrow>=15.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "mne>=1.6",
  "spikeinterface>=0.101",
  "astropy>=6.0",
  "PyWavelets>=1.5",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3", "mypy>=1.9"]
notebook = ["jupyterlab>=4.1", "ipywidgets>=8.1"]

[tool.setuptools.packages.find]
where = ["src"]
